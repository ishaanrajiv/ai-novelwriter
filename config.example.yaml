userInput:
  bookTitle: "The Last Ember"
  author: "AIWriter"
  language: "en"
  premise: "In a drowned megacity, a memory smuggler discovers their own past was fabricated."
  chapterCount: 10
  targetWordCount: 70000
  provider:
    type: "lmstudio"
    lmstudio:
      baseUrl: "http://127.0.0.1:1234/v1"
      apiKeyEnv: "LMSTUDIO_API_KEY"
    openrouter:
      apiKeyEnv: "OPENROUTER_API_KEY"
      httpRefererEnv: "OPENROUTER_HTTP_REFERER"
      appNameEnv: "OPENROUTER_APP_NAME"
  systemPromptTemplate:
    tone: "Atmospheric, tense, emotionally grounded"
    pov: "Third-person limited"
    tense: "Past"
    style: "Cinematic prose with clear scene momentum"
    constraints: "Maintain continuity, avoid repetition, preserve character voice"
    custom: "Use vivid sensory details and meaningful dialogue"
  modelConfig:
    defaultModel: "google/gemma-4-e4b"
  iterationPolicy:
    minPassesPerStage: 1
    maxPassesPerStage: 3
    convergenceWindow: 2
    deltaThreshold: 0.02
    stagnationPassStart: 2
    stagnationChangeThreshold: 0.015
    manualApprovalMode: false
    qualityFloor: 0.8
  blockPolicy:
    minBlocksPerChapter: 3
    maxBlocksPerChapter: 7
  retryPolicy:
    maxRetries: 3
    baseDelayMs: 750
    maxDelayMs: 8000
    jitterRatio: 0.15
runtime:
  artifactsRoot: ".artifacts/novels"
  tailWindowWords: 1200
